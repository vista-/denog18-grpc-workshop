name: denog18-gribi

mgmt:
  network: denog18-grpc-lab-mgmt
  ipv4-subnet: 172.50.20.0/24
  ipv6-subnet: 2001:172:50:20::/64

prefix: ""
topology:
  defaults:
    kind: nokia_srlinux
  kinds:
    nokia_srlinux:
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:26.7.1
  nodes:
    leaf1:
      startup-config: configs/leaf1-gribi-startup.cfg
      mgmt-ipv4: 172.50.20.2
      mgmt-ipv6: 2001:172:50:20::2
      type: ixr-x3b
      license: /opt/srexperts/srl.license
    leaf2:
      startup-config: configs/leaf2-gribi-startup.cfg
      mgmt-ipv4: 172.50.20.4
      mgmt-ipv6: 2001:172:50:20::4
    spine:
      startup-config: configs/spine-gribi-startup.cfg
      mgmt-ipv4: 172.50.20.3
      mgmt-ipv6: 2001:172:50:20::3
    ### TELEMETRY STACK ###
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.49.1
      binds:
        - ../configs/gnmic-config.yml:/gnmic-config.yml:ro
      cmd: --config /gnmic-config.yml --log subscribe
    prometheus:
      kind: linux
      image: quay.io/prometheus/prometheus:v3.16.0
      binds:
        - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml
      ports:
        - 9090:9090
    grafana:
      kind: linux
      image: grafana/grafana:13.3.1
      binds:
        - ../configs/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - ../configs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - configs/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 3000:3000
      env:
        GF_PLUGINS_PREINSTALL_SYNC: andrewbmchugh-flow-panel
  links:
    # spine-leaf links
    - endpoints: [ "leaf1:e1-1", "spine:e1-1" ]
    - endpoints: [ "leaf2:e1-2", "spine:e1-2" ]
    - endpoints: [ "leaf1:e1-5", "leaf2:e1-5" ]
